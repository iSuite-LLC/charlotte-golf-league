<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IMI Golf League 2026</title>
  <style>
    :root {
      --bg:           #111111;
      --surface:      #1e1e1e;
      --surface-hover:#252525;
      --border:       #333333;
      --text:         #ffffff;
      --muted:        #888888;
      --red:          #cc2027;
      --blue:         #1a6fc4;
      --green:        #5aaa35;
      --orange:       #e87722;
      --silver:       #aaaaaa;
      --bronze:       #cd7f32;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 15px;
      min-height: 100vh;
    }
    /* ── Header ── */
    .site-header {
      background: #000;
      border-bottom: 2px solid var(--orange);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-left  { display: flex; align-items: center; gap: 12px; }
    .imi-dots     { display: flex; gap: 5px; }
    .dot          { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .header-title-group h1 {
      font-size: 1.1rem; font-weight: 700;
      letter-spacing: 0.06em; text-transform: uppercase; line-height: 1.1;
    }
    .header-title-group .year {
      font-size: 0.72rem; color: var(--orange);
      font-weight: 600; letter-spacing: 0.1em;
    }
    .header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
    .round-badge {
      background: var(--orange); color: #000;
      font-size: 0.68rem; font-weight: 700;
      padding: 3px 8px; border-radius: 3px;
      text-transform: uppercase; letter-spacing: 0.05em;
    }
    .last-updated { font-size: 0.68rem; color: var(--muted); }
    /* ── Season Progress Bar ── */
    .season-progress {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .progress-label { font-size: 0.72rem; color: var(--text); font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; white-space: nowrap; }
    .progress-track { flex: 1; display: flex; gap: 4px; overflow: visible; }
    .progress-seg   { flex: 1; height: 12px; border-radius: 3px; background: #2a2a2a; position: relative; overflow: visible; }
    .progress-seg.complete    { background: var(--green); box-shadow: 0 0 6px rgba(90,170,53,0.45); }
    .progress-seg.in-progress { background: var(--orange); }
    .progress-cart  { position: absolute; right: -14px; top: 50%; transform: translateY(-50%); z-index: 10; pointer-events: none; }
    /* ── Tabs ── */
    .tab-nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      touch-action: pan-x;
    }
    .tab-nav::-webkit-scrollbar { display: none; }
    .tab-btn {
      background: none; border: none; color: var(--muted);
      cursor: pointer; font-size: 0.82rem; font-weight: 600;
      letter-spacing: 0.05em; padding: 12px 24px;
      text-transform: uppercase; transition: color 0.15s;
      border-bottom: 3px solid transparent; margin-bottom: -1px;
      flex-shrink: 0; white-space: nowrap;
    }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { color: var(--text); border-bottom-color: var(--blue); }
    /* ── Content ── */
    .content { max-width: 900px; margin: 0 auto; padding: 24px 16px; }
    .hidden  { display: none !important; }
    /* ── Podium ── */
    .podium { display: flex; justify-content: center; align-items: flex-end; gap: 8px; margin-bottom: 24px; }
    .podium-card {
      background: var(--surface); border-radius: 6px;
      padding: 14px 12px 16px; text-align: center;
      flex: 1; max-width: 220px; min-width: 0;
      border-top: 3px solid var(--border);
      cursor: pointer; transition: background 0.1s;
    }
    .podium-card:hover { background: var(--surface-hover); }
    .podium-card.first  { border-top-color: var(--orange); padding-bottom: 28px; }
    .podium-card.second { border-top-color: var(--silver); }
    .podium-card.third  { border-top-color: var(--bronze); }
    .podium-rank { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; }
    .podium-card.first  .podium-rank { color: var(--orange); }
    .podium-card.second .podium-rank { color: var(--silver); }
    .podium-card.third  .podium-rank { color: var(--bronze); }
    .podium-name { font-weight: 700; font-size: 0.92rem; margin-bottom: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .podium-pts  { font-size: 1.6rem; font-weight: 700; color: var(--orange); line-height: 1; }
    .podium-pts-label { font-size: 0.6rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; vertical-align: super; margin-left: 2px; }
    .podium-rec  { font-size: 0.72rem; margin-top: 5px; }
    .podium-rec .rec-w, .podium-rec .rec-l, .podium-rec .rec-d { color: #fff; }
    /* ── Search ── */
    .search-wrap { margin-bottom: 16px; }
    .search-input {
      width: 100%; background: var(--surface);
      border: 1px solid var(--border); border-radius: 4px;
      color: var(--text); font-size: 0.88rem;
      padding: 9px 14px; outline: none;
      transition: border-color 0.15s;
    }
    .search-input:focus { border-color: var(--blue); }
    .search-input::placeholder { color: #555; }
    /* ── Standings Table ── */
    .standings-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    .standings-table thead th {
      color: var(--muted); font-size: 0.68rem; font-weight: 600;
      letter-spacing: 0.08em; padding: 8px 12px;
      text-align: left; text-transform: uppercase;
      border-bottom: 1px solid var(--border);
    }
    .player-row { cursor: pointer; transition: background 0.1s; }
    .player-row:hover { background: var(--surface-hover); }
    .player-row.expanded { background: var(--surface); }
    .player-row td {
      padding: 11px 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    .player-row.muted td { color: var(--muted); cursor: default; }
    .rank-badge {
      display: inline-block; width: 26px; height: 26px;
      border-radius: 50%; background: var(--surface);
      color: var(--muted); font-size: 0.75rem; font-weight: 700;
      line-height: 26px; text-align: center;
    }
    .rank-badge.gold   { background: var(--orange); color: #000; }
    .rank-badge.silver { background: var(--silver);  color: #000; }
    .rank-badge.bronze { background: var(--bronze);  color: #fff; }
    .player-name { font-weight: 600; }
    .last-match  { font-size: 0.7rem; color: var(--muted); margin-top: 2px; }
    .lm-w { color: var(--green); }
    .lm-l { color: var(--red); }
    .pts     { font-weight: 700; font-size: 1rem; color: var(--orange); }
    .rec-w   { color: var(--green); font-weight: 600; }
    .rec-l   { color: var(--red);   font-weight: 600; }
    .rec-d   { color: var(--muted); }
    .avg-net { color: var(--blue); }
    .hcp     { color: var(--muted); font-size: 0.85rem; }
    .sparkline { display: inline-block; vertical-align: middle; overflow: visible; }
    /* ── Player expand panel ── */
    .expand-row td { padding: 0; background: #181818; border-bottom: 2px solid var(--blue); }
    .player-detail { padding: 12px 16px; }
    .detail-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    .detail-table th {
      color: var(--muted); font-size: 0.67rem; font-weight: 600;
      letter-spacing: 0.08em; padding: 6px 10px;
      text-align: left; text-transform: uppercase;
    }
    .detail-table td { padding: 7px 10px; border-top: 1px solid #2a2a2a; }
    .result-W { color: var(--green); font-weight: 700; }
    .result-D { color: var(--muted); font-weight: 700; }
    .result-L { color: var(--red); }
    /* ── Mobile player cards ── */
    .player-cards { display: none; }
    .player-card {
      background: var(--surface); border-radius: 6px;
      padding: 14px 16px; margin-bottom: 8px;
      cursor: pointer; border-left: 3px solid var(--border);
      transition: background 0.1s;
    }
    .player-card:hover { background: var(--surface-hover); }
    .player-card.rank-1 { border-left-color: var(--orange); }
    .player-card.rank-2 { border-left-color: var(--silver); }
    .player-card.rank-3 { border-left-color: var(--bronze); }
    .card-top    { display: flex; align-items: center; gap: 10px; }
    .card-name   { font-weight: 700; flex: 1; }
    .card-pts    { font-size: 1.1rem; font-weight: 700; color: var(--orange); }
    .card-bottom { display: flex; justify-content: space-between; margin-top: 8px; font-size: 0.78rem; padding-left: 36px; }
    .card-expand { border-top: 1px solid var(--border); margin: 10px -16px -14px; }
    /* ── Results ── */
    .round-section { background: var(--surface); border-radius: 6px; margin-bottom: 16px; overflow: hidden; }
    .round-header {
      background: #1a1a1a; border-left: 4px solid var(--orange);
      display: flex; align-items: center; gap: 12px; padding: 12px 16px;
    }
    .round-label { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
    .round-dates { color: var(--muted); font-size: 0.8rem; }
    .badge { font-size: 0.65rem; font-weight: 700; padding: 3px 7px; border-radius: 3px; text-transform: uppercase; letter-spacing: 0.05em; margin-left: auto; }
    .badge.in-progress { background: var(--orange); color: #000; }
    .badge.complete    { background: #2a2a2a; color: var(--green); }
    .round-bye { color: var(--muted); font-size: 0.78rem; padding: 6px 16px; border-bottom: 1px solid var(--border); }
    .matches { padding: 8px 0; }
    .match-wrap + .match-wrap { border-top: 1px solid #2a2a2a; }
    .match { display: flex; align-items: center; gap: 12px; padding: 8px 16px; }
    .match.clickable-match { cursor: pointer; }
    .match.clickable-match:hover { background: var(--surface-hover); }
    .match-winner    { font-weight: 700; color: var(--green); }
    .match-loser     { color: var(--muted); }
    .pairing-unplayed { color: var(--muted); font-style: italic; }
    .match-p1    { flex: 1; }
    .match-p2    { flex: 1; text-align: right; }
    .match-score { color: var(--orange); font-size: 0.85rem; font-weight: 700; white-space: nowrap; min-width: 55px; text-align: center; }
    .sc-chevron  { font-size: 0.65rem; color: var(--muted); flex-shrink: 0; }
    /* ── Scorecard panel ── */
    .scorecard-panel { background: #141414; padding: 10px 16px 14px; }
    .sc-meta { font-size: 0.7rem; color: var(--muted); margin-bottom: 8px; letter-spacing: 0.02em; }
    .sc-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .sc-table { border-collapse: collapse; font-size: 0.8rem; white-space: nowrap; }
    .sc-table th, .sc-table td { padding: 4px 7px; text-align: center; }
    .sc-th-label, .sc-td-label { text-align: left !important; font-size: 0.7rem; color: var(--muted); font-weight: 600; min-width: 52px; }
    .sc-hole-num { color: var(--muted); font-size: 0.68rem; font-weight: 600; min-width: 24px; }
    .sc-par-row td { color: #555; font-size: 0.75rem; border-bottom: 1px solid #222; }
    .sc-gross-row td { font-weight: 700; }
    .sc-gross-row.sc-p-winner .sc-td-label { color: var(--green); }
    .sc-net-row td { color: var(--muted); font-size: 0.75rem; border-bottom: 1px solid #1c1c1c; }
    .sc-total-col { border-left: 1px solid #2a2a2a !important; font-weight: 700; }
    .sc-note { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; }
    .sc-birdie .sc-note { border: 1.5px solid #fff; border-radius: 50%; }
    .sc-eagle  .sc-note { border: 1.5px solid #fff; border-radius: 50%; box-shadow: 0 0 0 2.5px #141414, 0 0 0 4px #fff; }
    .sc-bogey  .sc-note { border: 1.5px solid #fff; }
    .sc-double .sc-note { border: 1.5px solid #fff; box-shadow: 0 0 0 2.5px #141414, 0 0 0 4px #fff; }
    .sc-table td { padding: 5px 9px; }
    /* ── Schedule ── */
    .schedule-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    .schedule-table thead th {
      color: var(--muted); font-size: 0.68rem; font-weight: 600;
      letter-spacing: 0.08em; padding: 8px 12px;
      text-align: left; text-transform: uppercase;
      border-bottom: 1px solid var(--border);
    }
    .schedule-table td { padding: 11px 12px; border-bottom: 1px solid var(--border); }
    .schedule-table tr.current-round td  { background: #1e1e1e; }
    .schedule-table tr.complete-round td { color: var(--muted); }
    .schedule-table tr.clickable { cursor: pointer; transition: background 0.1s; }
    .schedule-table tr.clickable:hover td { background: var(--surface-hover); }
    .schedule-expand-row td { padding: 0; background: #181818; border-bottom: 2px solid var(--orange); }
    .schedule-detail { padding: 12px 16px; }
    .matchup-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    .matchup-table td { padding: 7px 10px; border-top: 1px solid #2a2a2a; }
    .status-complete { color: var(--green);  font-weight: 600; }
    .status-current  { color: var(--orange); font-weight: 600; }
    .status-upcoming { color: #555; }
    /* ── Stats ── */
    .course-box       { background: var(--surface); border-radius: 6px; padding: 16px; margin-bottom: 20px; border: 1px solid var(--border); }
    .course-box-title { font-size: 0.95rem; font-weight: 700; margin-bottom: 14px; }
    .stats-section  { margin-bottom: 16px; }
    .stats-section:last-child { margin-bottom: 0; }
    .stats-heading  { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 10px; padding-bottom: 5px; border-bottom: 1px solid var(--border); }
    .hole-grid      { display: grid; grid-template-columns: repeat(9, 1fr); gap: 6px; }
    .hole-card      { background: var(--surface); border-radius: 5px; padding: 10px 4px 8px; text-align: center; }
    .hole-card-num  { font-size: 0.6rem; color: var(--muted); font-weight: 600; margin-bottom: 2px; letter-spacing: 0.05em; text-transform: uppercase; }
    .hole-card-par  { font-size: 0.7rem; color: #555; margin-bottom: 5px; }
    .hole-card-avg  { font-size: 1rem; font-weight: 700; margin-bottom: 3px; }
    .hole-card-diff { font-size: 0.72rem; font-weight: 700; margin-bottom: 6px; }
    .hole-card-bar  { height: 4px; border-radius: 2px; background: #2a2a2a; margin: 0 6px; }
    .hole-card-bar-fill { height: 100%; border-radius: 2px; }
    .diff-under  { color: var(--green); }
    .diff-even   { color: var(--muted); }
    .diff-bogey  { color: var(--orange); }
    .diff-hard   { color: var(--red); }
    /* ── Photos ── */
    .upload-bar   { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .upload-btn   { background: var(--orange); color: #000; border: none; border-radius: 4px; padding: 8px 18px; font-size: 0.82rem; font-weight: 700; cursor: pointer; letter-spacing: 0.05em; text-transform: uppercase; transition: opacity 0.15s; }
    .upload-btn:hover    { opacity: 0.85; }
    .upload-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .upload-status { font-size: 0.78rem; color: var(--muted); }
    .photo-grid   { columns: 3 180px; column-gap: 8px; }
    .photo-item   { break-inside: avoid; margin-bottom: 8px; border-radius: 4px; overflow: hidden; cursor: pointer; }
    .photo-item img { width: 100%; display: block; transition: opacity 0.15s; }
    .photo-item:hover img { opacity: 0.82; }
    .lightbox     { position: fixed; inset: 0; background: rgba(0,0,0,0.92); display: flex; align-items: center; justify-content: center; z-index: 1000; cursor: pointer; }
    .lightbox img { max-width: 90vw; max-height: 90vh; object-fit: contain; border-radius: 4px; }
    /* ── H2H ── */
    .h2h-section { margin-top: 12px; padding-top: 10px; border-top: 1px solid #2a2a2a; }
    .h2h-heading { font-size: 0.67rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; padding: 0 10px; margin-bottom: 4px; }
    /* ── Responsive ── */
    @media (max-width: 600px) {
      .site-header { flex-direction: column; align-items: flex-start; gap: 8px; }
      .header-right { align-items: flex-start; }
      .tab-btn { padding: 10px 14px; font-size: 0.75rem; }
      .standings-table { display: none; }
      .player-cards { display: block; }
      .podium-card { padding: 10px 8px 14px; }
      .podium-pts  { font-size: 1.2rem; }
      .hole-grid   { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>

<header class="site-header">
  <div class="header-left">
    <div class="imi-dots">
      <span class="dot" style="background:#cc2027"></span>
      <span class="dot" style="background:#1a6fc4"></span>
      <span class="dot" style="background:#5aaa35"></span>
      <span class="dot" style="background:#e87722"></span>
    </div>
    <div class="header-title-group">
      <h1>IMI Golf League</h1>
      <div class="year">2026 Season</div>
    </div>
  </div>
  <div class="header-right">
    <span id="current-round-badge" class="round-badge" style="display:none"></span>
    <span id="last-updated" class="last-updated"></span>
  </div>
</header>

<div id="season-progress" class="season-progress" style="display:none">
  <span class="progress-label">Season</span>
  <div class="progress-track" id="progress-track"></div>
  <span id="progress-text" class="progress-label"></span>
</div>

<nav class="tab-nav">
  <button class="tab-btn active" onclick="showTab('standings', this)">Standings</button>
  <button class="tab-btn"        onclick="showTab('results', this)">Results</button>
  <button class="tab-btn"        onclick="showTab('schedule', this)">Schedule</button>
  <button class="tab-btn"        onclick="showTab('stats', this)">Stats</button>
  <button class="tab-btn"        onclick="showTab('photos', this)">Photos</button>
</nav>

<main class="content">
  <div id="tab-standings" class="tab-pane"></div>
  <div id="tab-results"   class="tab-pane hidden"></div>
  <div id="tab-schedule"  class="tab-pane hidden"></div>
  <div id="tab-stats"     class="tab-pane hidden"></div>
  <div id="tab-photos"   class="tab-pane hidden"></div>
</main>

<script>
  let leagueData = null;

  async function init() {
    try {
      const resp = await fetch('data.json');
      if (!resp.ok) throw new Error('fetch failed');
      leagueData = await resp.json();
      renderAll();
    } catch (e) {
      document.querySelector('.content').innerHTML =
        '<p style="color:#555;text-align:center;padding:60px 0">Could not load league data.</p>';
    }
  }

  function renderAll() {
    renderHeader();
    renderSeasonProgress();
    renderStandings();
    renderResults();
    renderSchedule();
    renderStats();
    renderPhotos();
  }

  function showTab(name, btn) {
    document.querySelectorAll('.tab-pane').forEach(p => p.classList.add('hidden'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('tab-' + name).classList.remove('hidden');
    btn.classList.add('active');
  }

  /* ── Header ── */
  function renderHeader() {
    document.getElementById('last-updated').textContent = 'Updated: ' + leagueData.lastUpdated;
    const cur  = leagueData.rounds.find(r => r.status === 'in_progress');
    const last = [...leagueData.rounds].reverse().find(r => r.status === 'complete');
    const badge = document.getElementById('current-round-badge');
    if (cur) {
      badge.textContent   = 'Round ' + cur.round + ' In Progress';
      badge.style.display = 'inline-block';
    } else if (last) {
      badge.textContent   = 'Round ' + last.round + ' Complete';
      badge.style.display = 'inline-block';
    }
  }

  /* ── Season Progress Bar ── */

  function renderSeasonProgress() {
    const complete = leagueData.rounds.filter(r => r.status === 'complete').length;
    const lastActiveIdx = leagueData.rounds.reduce((last, r, i) =>
      (r.status === 'complete' || r.status === 'in_progress') ? i : last, -1);
    const segs = leagueData.rounds.map((r, i) => {
      const cls = r.status === 'complete' ? 'complete' : r.status === 'in_progress' ? 'in-progress' : '';
      const cart = i === lastActiveIdx ? CART_SVG : '';
      return `<div class="progress-seg ${cls}">${cart}</div>`;
    }).join('');
    document.getElementById('progress-track').innerHTML = segs;
    document.getElementById('progress-text').textContent = complete + '/' + leagueData.rounds.length;
    document.getElementById('season-progress').style.display = 'flex';
  }

  /* ── Shared helpers ── */
  function rankBadge(rank) {
    const cls = rank === 1 ? 'gold' : rank === 2 ? 'silver' : rank === 3 ? 'bronze' : '';
    return `<span class="rank-badge ${cls}">${rank}</span>`;
  }

  function recordHTML(record) {
    const parts = (record || '').split('-');
    if (parts.length < 3) return record || '—';
    const [w, l, d] = parts;
    return `<span class="rec-w">${w}</span>-<span class="rec-l">${l}</span>-<span class="rec-d">${d}</span>`;
  }

  function lastMatchHTML(player) {
    if (!player.rounds.length) return '';
    const last = player.rounds[player.rounds.length - 1];
    const opp  = last.opponent ? last.opponent.split(' ')[0] : null;
    const verb = last.result === 'W' ? 'Beat' : last.result === 'L' ? 'Lost to' : 'Drew';
    const cls  = last.result === 'W' ? 'lm-w' : last.result === 'L' ? 'lm-l' : '';
    const tail = opp ? ` ${opp} &middot; R${last.round}` : ` &middot; R${last.round}`;
    return `<div class="last-match"><span class="${cls}">${verb}</span>${tail}</div>`;
  }

  function streakHTML(player) {
    if (!player.rounds.length) return '—';
    const results = player.rounds.map(r => r.result);
    const last = results[results.length - 1];
    let count = 0;
    for (let i = results.length - 1; i >= 0; i--) {
      if (results[i] === last) count++;
      else break;
    }
    const color = last === 'W' ? 'var(--green)' : last === 'L' ? 'var(--red)' : 'var(--muted)';
    return `<span style="font-weight:700;color:${color}">${last}${count}</span>`;
  }

  function renderPlayerDetail(player) {
    if (!player.rounds.length) {
      return '<div class="player-detail"><p style="color:#555;font-size:0.8rem;padding:4px 0">No rounds played yet.</p></div>';
    }
    const rows = player.rounds.map(r => `
      <tr>
        <td>R${r.round}</td>
        <td>${r.opponent || '—'}</td>
        <td class="result-${r.result}">${r.result}</td>
        <td>${r.matchPts}</td>
        <td>${r.net !== null ? r.net : '—'}</td>
      </tr>`).join('');

    // Head-to-head tally
    const h2h = {};
    for (const rd of player.rounds) {
      if (!rd.opponent) continue;
      if (!h2h[rd.opponent]) h2h[rd.opponent] = { w: 0, l: 0, d: 0 };
      if      (rd.result === 'W') h2h[rd.opponent].w++;
      else if (rd.result === 'L') h2h[rd.opponent].l++;
      else                        h2h[rd.opponent].d++;
    }
    let h2hHTML = '';
    if (Object.keys(h2h).length) {
      const h2hRows = Object.entries(h2h)
        .sort((a, b) => (b[1].w - b[1].l) - (a[1].w - a[1].l))
        .map(([opp, rec]) => `
          <tr>
            <td>${opp}</td>
            <td><span class="rec-w">${rec.w}</span>-<span class="rec-l">${rec.l}</span>-<span class="rec-d">${rec.d}</span></td>
          </tr>`).join('');
      h2hHTML = `<div class="h2h-section">
        <div class="h2h-heading">Head to Head</div>
        <table class="detail-table">
          <thead><tr><th>Opponent</th><th>Record</th></tr></thead>
          <tbody>${h2hRows}</tbody>
        </table>
      </div>`;
    }

    return `<div class="player-detail">
      <table class="detail-table">
        <thead><tr><th>Rd</th><th>Opponent</th><th>Result</th><th>Pts</th><th>NET</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      ${h2hHTML}
    </div>`;
  }

  /* ── Podium ── */
  function renderPodium(ranked) {
    if (!ranked.length) return '';
    const top  = ranked.slice(0, Math.min(3, ranked.length));
    const order    = top.length >= 3 ? [top[1], top[0], top[2]] : top.length === 2 ? [top[1], top[0]] : [top[0]];
    const rankNums = top.length >= 3 ? [2, 1, 3]                : top.length === 2 ? [2, 1]           : [1];
    const clsMap   = { 1: 'first', 2: 'second', 3: 'third' };
    const labelMap = { 1: '1st Place', 2: '2nd Place', 3: '3rd Place' };
    const cards = order.map((p, i) => {
      const rank = rankNums[i];
      return `<div class="podium-card ${clsMap[rank]}" onclick="toggleExpand('${p.id}')">
        <div class="podium-rank">${labelMap[rank]}</div>
        <div class="podium-name">${p.name.split(' ')[0]}</div>
        <div class="podium-pts">${p.totalPts}<span class="podium-pts-label">pts</span></div>
        <div class="podium-rec">${recordHTML(p.record)}</div>
      </div>`;
    }).join('');
    return `<div class="podium">${cards}</div>`;
  }

  /* ── Standings ── */
  function toggleExpand(playerId) {
    document.getElementById('expand-' + playerId).classList.toggle('hidden');
    document.getElementById('row-'    + playerId).classList.toggle('expanded');
  }

  function toggleCardExpand(playerId) {
    document.getElementById('card-expand-' + playerId).classList.toggle('hidden');
  }

  function filterStandings(query) {
    const q = query.toLowerCase();
    document.querySelectorAll('#tab-standings .player-row').forEach(row => {
      const name = row.querySelector('.player-name');
      if (!name) return;
      const show = name.textContent.toLowerCase().includes(q);
      row.style.display = show ? '' : 'none';
      const exp = document.getElementById('expand-' + row.id.replace('row-', ''));
      if (exp) exp.style.display = show ? '' : 'none';
    });
    document.querySelectorAll('#tab-standings .player-card').forEach(card => {
      const name = card.querySelector('.card-name');
      if (!name) return;
      card.style.display = name.textContent.toLowerCase().includes(q) ? '' : 'none';
    });
  }

  function renderStandings() {
    const ranked   = leagueData.players
      .filter(p => p.rounds.length > 0)
      .sort((a, b) => b.totalPts - a.totalPts || (a.avgNet || 999) - (b.avgNet || 999));
    const unranked = leagueData.players.filter(p => p.rounds.length === 0);

    const hcp = p => (p.handicap != null ? p.handicap : '—');

    // Podium
    const podiumHTML = renderPodium(ranked);

    // Search
    const searchHTML = `<div class="search-wrap">
      <input class="search-input" type="text" placeholder="Search players..." oninput="filterStandings(this.value)">
    </div>`;

    // Desktop table (7 cols: Rank, Player, Hcp, Pts, Record, Avg NET, Form)
    let tableHTML = `<table class="standings-table">
      <thead><tr>
        <th>Rank</th><th>Player</th><th>Hcp</th><th>Pts</th><th>Record</th><th>Avg NET</th><th>Streak</th>
      </tr></thead><tbody>`;

    ranked.forEach((p, i) => {
      tableHTML += `
        <tr class="player-row" id="row-${p.id}" onclick="toggleExpand('${p.id}')">
          <td>${rankBadge(i + 1)}</td>
          <td>
            <div class="player-name">${p.name}</div>
            ${lastMatchHTML(p)}
          </td>
          <td class="hcp">${hcp(p)}</td>
          <td class="pts">${p.totalPts}</td>
          <td>${recordHTML(p.record)}</td>
          <td class="avg-net">${p.avgNet !== null ? p.avgNet.toFixed(1) : '—'}</td>
          <td>${streakHTML(p)}</td>
        </tr>
        <tr class="expand-row hidden" id="expand-${p.id}">
          <td colspan="7">${renderPlayerDetail(p)}</td>
        </tr>`;
    });

    unranked.forEach(p => {
      tableHTML += `<tr class="player-row muted">
        <td>—</td><td class="player-name">${p.name}</td>
        <td class="hcp">${hcp(p)}</td><td>—</td><td>—</td><td>—</td><td></td>
      </tr>`;
    });
    tableHTML += '</tbody></table>';

    // Mobile cards
    let cardsHTML = '<div class="player-cards">';
    ranked.forEach((p, i) => {
      const rank = i + 1;
      cardsHTML += `
        <div class="player-card ${rank <= 3 ? 'rank-' + rank : ''}" onclick="toggleCardExpand('${p.id}')">
          <div class="card-top">
            <span style="min-width:26px">${rankBadge(rank)}</span>
            <span class="card-name">${p.name}</span>
            <span class="card-pts">${p.totalPts}</span>
          </div>
          <div class="card-bottom">
            <span>${recordHTML(p.record)}</span>
            <span class="hcp">HCP ${hcp(p)}</span>
            <span class="avg-net">${p.avgNet !== null ? p.avgNet.toFixed(1) : '—'} avg</span>
          </div>
          <div id="card-expand-${p.id}" class="card-expand hidden">
            ${renderPlayerDetail(p)}
          </div>
        </div>`;
    });
    unranked.forEach(p => {
      cardsHTML += `<div class="player-card" style="opacity:0.45">
        <div class="card-top">
          <span style="min-width:26px;color:#555;font-size:0.75rem;font-weight:700">—</span>
          <span class="card-name">${p.name}</span>
          <span class="card-pts" style="color:#555">—</span>
        </div>
      </div>`;
    });
    cardsHTML += '</div>';

    document.getElementById('tab-standings').innerHTML = podiumHTML + searchHTML + tableHTML + cardsHTML;
  }

  /* ── Scorecard ── */
  function toggleScorecard(id) {
    const el = document.getElementById(id);
    if (el) el.classList.toggle('hidden');
  }

  function scorecardHTML(match, id) {
    const sc1 = match.p1Scorecard;
    const sc2 = match.p2Scorecard;
    if (!sc1 && !sc2) return '';

    function scoreColor(gross, par) {
      if (gross == null || par == null) return '';
      const d = gross - par;
      if (d <= -2) return 'sc-eagle';
      if (d === -1) return 'sc-birdie';
      if (d === 0)  return '';
      if (d === 1)  return 'sc-bogey';
      return 'sc-double';
    }

    function parRowHTML(par, total) {
      if (!par) return '';
      const cells = par.map(p => `<td>${p != null ? p : '—'}</td>`).join('');
      return `<tr class="sc-par-row"><td class="sc-td-label">Par</td>${cells}<td class="sc-total-col">${total != null ? total : ''}</td></tr>`;
    }

    function playerRowsHTML(firstName, sc, isWinner) {
      if (!sc) return '';
      const gross = sc.gross || [], par = sc.par || [], net = sc.net || [];
      const grossCells = par.map((p, i) => {
        const cls = scoreColor(gross[i], p);
        const val = gross[i] != null ? gross[i] : '—';
        return cls ? `<td class="${cls}"><span class="sc-note">${val}</span></td>` : `<td>${val}</td>`;
      }).join('');
      const netCells = net.map(n => `<td>${n != null ? n : '—'}</td>`).join('');
      const hcpLabel = sc.handicap != null ? `<br><span style="font-size:0.63rem;color:#555;font-weight:400">${sc.handicap} hc</span>` : '';
      return `
        <tr class="sc-gross-row${isWinner ? ' sc-p-winner' : ''}">
          <td class="sc-td-label">${firstName}${hcpLabel}</td>${grossCells}
          <td class="sc-total-col">${sc.grossTotal != null ? sc.grossTotal : '—'}</td>
        </tr>
        <tr class="sc-net-row">
          <td class="sc-td-label" style="font-size:0.63rem;color:#444">net</td>${netCells}
          <td class="sc-total-col">${sc.netTotal != null ? sc.netTotal : '—'}</td>
        </tr>`;
    }

    const parHTML = parRowHTML((sc1 || sc2).par, (sc1 || sc2).parTotal);

    const p1First = match.p1.split(' ')[0];
    const p2First = match.p2.split(' ')[0];
    const sc = sc1 || sc2;
    const metaLine = [sc.course, sc.nine].filter(Boolean).join(' · ');

    const holeHdrs = [1,2,3,4,5,6,7,8,9].map(h => `<th class="sc-hole-num">${h}</th>`).join('');

    return `<div id="${id}" class="scorecard-panel hidden">
      <div class="sc-meta">${metaLine}</div>
      <div class="sc-scroll"><table class="sc-table">
        <thead>
          <tr><th class="sc-th-label">Hole</th>${holeHdrs}<th class="sc-hole-num sc-total-col">TOT</th></tr>
          ${parHTML}
        </thead>
        <tbody>
          ${playerRowsHTML(p1First, sc1, match.winner === match.p1)}
          ${playerRowsHTML(p2First, sc2, match.winner === match.p2)}
        </tbody>
      </table></div>
    </div>`;
  }

  /* ── Results ── */
  function renderResults() {
    const html = leagueData.rounds.map(r => {
      if (r.status === 'upcoming') {
        return `<div class="round-section" style="opacity:0.4">
          <div class="round-header">
            <span class="round-label">Round ${r.round}</span>
            <span class="round-dates">${r.dates}</span>
            <span class="badge" style="background:#2a2a2a;color:#555;margin-left:auto">Upcoming</span>
          </div>
        </div>`;
      }
      const badgeCls = r.status === 'in_progress' ? 'in-progress' : 'complete';
      const badgeTxt = r.status === 'in_progress' ? 'In Progress' : 'Complete';
      const played = (r.pairings || r.matches || []).filter(m => m.played !== false);
      const matchRows = played.map((m, mi) => {
        const draw    = m.winner === null;
        const scId    = `sc-r${r.round}-m${mi}`;
        const hasCard = !!(m.p1Scorecard || m.p2Scorecard);
        const sc      = hasCard ? scorecardHTML(m, scId) : '';
        return `<div class="match-wrap">
          <div class="match${hasCard ? ' clickable-match' : ''}"${hasCard ? ` onclick="toggleScorecard('${scId}')"` : ''}>
            <span class="match-p1 ${!draw && m.winner === m.p1 ? 'match-winner' : 'match-loser'}">${m.p1}</span>
            <span class="match-score">${m.p1Pts} – ${m.p2Pts}</span>
            <span class="match-p2 ${!draw && m.winner === m.p2 ? 'match-winner' : 'match-loser'}">${m.p2}</span>
            ${hasCard ? '<span class="sc-chevron">▾</span>' : ''}
          </div>
          ${sc}
        </div>`;
      }).join('');
      return `<div class="round-section">
        <div class="round-header">
          <span class="round-label">Round ${r.round}</span>
          <span class="round-dates">${r.dates}</span>
          <span class="badge ${badgeCls}">${badgeTxt}</span>
        </div>
        <div class="round-bye"><span style="color:var(--orange);font-weight:600">BYE:</span> ${r.bye}</div>
        <div class="matches">${matchRows}</div>
      </div>`;
    }).join('');
    document.getElementById('tab-results').innerHTML = html;
  }

  /* ── Schedule ── */
  function toggleRound(roundNum) {
    document.getElementById('round-expand-' + roundNum).classList.toggle('hidden');
  }

  function renderRoundDetail(roundNum) {
    const rd = leagueData.rounds.find(r => r.round === roundNum);
    if (!rd || !rd.pairings || !rd.pairings.length) {
      return '<div class="schedule-detail"><p style="color:#555;font-size:0.82rem">No matchups scheduled.</p></div>';
    }
    const rows = rd.pairings.map(m => {
      const draw = m.played && m.winner === null;
      const p1cls = !m.played ? 'pairing-unplayed' : (!draw && m.winner === m.p1 ? 'match-winner' : 'match-loser');
      const p2cls = !m.played ? 'pairing-unplayed' : (!draw && m.winner === m.p2 ? 'match-winner' : 'match-loser');
      const score = m.played
        ? `<span style="color:var(--orange);font-weight:700">${m.p1Pts} – ${m.p2Pts}</span>`
        : `<span style="color:#555;font-style:italic">Not played</span>`;
      return `<tr>
        <td class="${p1cls}">${m.p1}</td>
        <td style="text-align:center;width:90px">${score}</td>
        <td class="${p2cls}" style="text-align:right">${m.p2}</td>
      </tr>`;
    }).join('');
    return `<div class="schedule-detail">
      <table class="matchup-table"><tbody>${rows}</tbody></table>
    </div>`;
  }

  function renderSchedule() {
    const rows = leagueData.schedule.map(s => {
      const rd     = leagueData.rounds.find(r => r.round === s.round);
      const status = rd ? rd.status : 'upcoming';
      const statusHTML =
        status === 'complete'    ? '<span class="status-complete">Done</span>'     :
        status === 'in_progress' ? '<span class="status-current">Now</span>'       :
                                   '<span class="status-upcoming">Upcoming</span>';
      const rowCls = [
        status === 'in_progress' ? 'current-round' : status === 'complete' ? 'complete-round' : '',
        'clickable'
      ].join(' ').trim();
      return `<tr class="${rowCls}" id="round-row-${s.round}" onclick="toggleRound(${s.round})">
          <td>R${s.round}</td>
          <td>${s.dates}</td>
          <td>${s.bye}</td>
          <td>${statusHTML}</td>
        </tr>
        <tr class="schedule-expand-row hidden" id="round-expand-${s.round}">
          <td colspan="4">${renderRoundDetail(s.round)}</td>
        </tr>`;
    }).join('');
    document.getElementById('tab-schedule').innerHTML = `
      <table class="schedule-table">
        <thead><tr><th>Round</th><th>Dates</th><th>BYE</th><th>Status</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
  }

  /* ── Stats ── */
  function buildHoleDifficulty() {
    const courses = {};
    for (const round of leagueData.rounds) {
      for (const pairing of (round.pairings || [])) {
        if (!pairing.played) continue;
        for (const sc of [pairing.p1Scorecard, pairing.p2Scorecard]) {
          if (!sc || !sc.gross || !sc.par) continue;
          const key = [sc.course, sc.nine].filter(Boolean).join(' · ');
          if (!courses[key]) courses[key] = { par: sc.par.slice(), totals: new Array(9).fill(0), counts: new Array(9).fill(0) };
          sc.gross.forEach((g, i) => { if (g != null) { courses[key].totals[i] += g; courses[key].counts[i]++; } });
        }
      }
    }
    const result = {};
    for (const [key, d] of Object.entries(courses)) {
      result[key] = {
        par:      d.par,
        avgGross: d.totals.map((t, i) => d.counts[i] > 0 ? t / d.counts[i] : null),
        counts:   d.counts,
      };
    }
    return result;
  }

  function renderStats() {
    const difficulty = buildHoleDifficulty();
    if (!Object.keys(difficulty).length) {
      document.getElementById('tab-stats').innerHTML =
        '<p style="color:#555;text-align:center;padding:60px 0">No scorecard data yet.</p>';
      return;
    }

    // Group by course name, preserve front/back as sub-sections
    const byCourse = {};
    for (const [key, data] of Object.entries(difficulty)) {
      const sep    = key.lastIndexOf(' · ');
      const course = sep >= 0 ? key.slice(0, sep) : key;
      const nine   = sep >= 0 ? key.slice(sep + 3) : '';
      if (!byCourse[course]) byCourse[course] = [];
      byCourse[course].push({ nine, data });
    }

    function nineSection(nine, data) {
      const isBack = nine === 'Back 9';
      let cards, n;
      if (!data) {
        n = 0;
        cards = Array.from({ length: 9 }, (_, i) => `<div class="hole-card">
          <div class="hole-card-num">Hole ${isBack ? i + 10 : i + 1}</div>
          <div class="hole-card-par" style="color:#2a2a2a">—</div>
          <div class="hole-card-avg" style="color:#2a2a2a">—</div>
          <div class="hole-card-diff" style="color:#2a2a2a">—</div>
          <div class="hole-card-bar"></div>
        </div>`).join('');
      } else {
        n = data.counts[0] || 0;
        cards = data.par.map((par, i) => {
          const holeNum = isBack ? i + 10 : i + 1;
          const avg = data.avgGross[i];
          if (avg == null || par == null) return `<div class="hole-card"><div class="hole-card-num">Hole ${holeNum}</div><div class="hole-card-par">—</div></div>`;
          const diff     = avg - par;
          const diffStr  = diff === 0 ? 'E' : (diff > 0 ? '+' : '') + diff.toFixed(1);
          const cls      = diff < 0 ? 'diff-under' : diff < 0.5 ? 'diff-even' : diff < 1.5 ? 'diff-bogey' : 'diff-hard';
          const barColor = diff < 0 ? 'var(--green)' : diff < 1 ? '#555' : diff < 2 ? 'var(--orange)' : 'var(--red)';
          const barPct   = Math.min(100, Math.max(0, (diff / 3) * 100));
          return `<div class="hole-card">
            <div class="hole-card-num">Hole ${holeNum}</div>
            <div class="hole-card-par">Par ${par}</div>
            <div class="hole-card-avg">${avg.toFixed(1)}</div>
            <div class="hole-card-diff ${cls}">${diffStr}</div>
            <div class="hole-card-bar"><div class="hole-card-bar-fill" style="width:${barPct.toFixed(0)}%;background:${barColor}"></div></div>
          </div>`;
        }).join('');
      }
      return `<div class="stats-section">
        <div class="stats-heading">${nine} <span style="font-weight:400;color:#555;font-size:0.65rem">(${n} rounds)</span></div>
        <div class="hole-grid">${cards}</div>
      </div>`;
    }

    let html = '';
    for (const [course, sections] of Object.entries(byCourse).sort((a, b) => a[0].localeCompare(b[0]))) {
      // Ensure both nines exist; Front 9 always on top
      for (const nine of ['Front 9', 'Back 9']) {
        if (!sections.find(s => s.nine === nine)) sections.push({ nine, data: null });
      }
      sections.sort((a, b) => a.nine === 'Front 9' ? -1 : 1);
      html += `<div class="course-box">
        <div class="course-box-title">${course}</div>
        ${sections.map(s => nineSection(s.nine, s.data)).join('')}
      </div>`;
    }
    document.getElementById('tab-stats').innerHTML = html;
  }

  /* ── Photos ── */
  const CLOUD_NAME    = 'drt2wzgmx';
  const UPLOAD_PRESET = 'golf-league-uploads';
  let sessionPhotos   = [];

  async function fetchPhotos() {
    try {
      const res = await fetch('photos.json');
      if (!res.ok) return [];
      const data = await res.json();
      return data.photos || [];
    } catch (e) { return []; }
  }

  function thumbUrl(url) {
    return url.replace('/upload/', '/upload/w_600,c_limit,q_auto,f_auto/');
  }

  function openLightbox(url) {
    const lb = document.createElement('div');
    lb.className = 'lightbox';
    lb.innerHTML = `<img src="${url.replace('/upload/', '/upload/q_auto,f_auto/')}" alt="League photo">`;
    lb.onclick = () => lb.remove();
    document.body.appendChild(lb);
  }

  async function refreshPhotoGrid() {
    const grid = document.getElementById('photo-grid');
    if (!grid) return;
    if (!sessionPhotos.length) {
      grid.innerHTML = '<p style="color:#555;text-align:center;padding:40px 0;width:100%">Loading photos...</p>';
    }
    const stored    = await fetchPhotos();
    const storedIds = new Set(stored.map(p => p.public_id));
    const all       = [...sessionPhotos.filter(p => !storedIds.has(p.public_id)), ...stored];
    if (!all.length) {
      grid.innerHTML = '<p style="color:#555;text-align:center;padding:40px 0;width:100%">No photos yet — be the first to upload!</p>';
      return;
    }
    grid.innerHTML = all.map(p =>
      p.resource_type === 'video'
        ? `<div class="photo-item">
            <video src="${p.url}" controls playsinline preload="metadata" style="width:100%;display:block;border-radius:4px"></video>
           </div>`
        : `<div class="photo-item" onclick="openLightbox('${p.url}')">
            <img src="${thumbUrl(p.url)}" alt="League photo" loading="lazy">
           </div>`
    ).join('');
  }

  async function handleUpload(input) {
    const files  = Array.from(input.files);
    if (!files.length) return;
    const btn    = document.getElementById('upload-btn');
    const status = document.getElementById('upload-status');
    btn.disabled = true;
    const newPhotos = [];
    for (let i = 0; i < files.length; i++) {
      status.textContent = `Uploading ${i + 1} of ${files.length}...`;
      const form = new FormData();
      form.append('file', files[i]);
      form.append('upload_preset', UPLOAD_PRESET);
      form.append('resource_type', 'auto');
      try {
        const res  = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/auto/upload`, { method: 'POST', body: form });
        const data = await res.json();
        if (data.secure_url) newPhotos.push({ url: data.secure_url, public_id: data.public_id, created_at: data.created_at, width: data.width, height: data.height, resource_type: data.resource_type });
      } catch (e) { console.error('Upload error:', e); }
    }
    btn.disabled = false;
    input.value  = '';
    if (newPhotos.length) {
      sessionPhotos.unshift(...newPhotos);
      status.textContent = `${newPhotos.length} photo${newPhotos.length > 1 ? 's' : ''} uploaded!`;
    } else {
      status.textContent = 'Upload failed — please try again.';
    }
    setTimeout(() => { if (status) status.textContent = ''; }, 4000);
    await refreshPhotoGrid();
  }

  function renderPhotos() {
    document.getElementById('tab-photos').innerHTML = `
      <div class="upload-bar">
        <button class="upload-btn" id="upload-btn" onclick="document.getElementById('photo-input').click()">+ Upload Photos</button>
        <span class="upload-status" id="upload-status"></span>
        <input type="file" id="photo-input" accept="image/*,video/*" multiple style="display:none" onchange="handleUpload(this)">
      </div>
      <div id="photo-grid" class="photo-grid"></div>`;
    refreshPhotoGrid();
  }

  init();
</script>
</body>
</html>
